name: Build Application and Make Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "true"
          path: "PakClient-source"

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV

      - name: Package artifacts properly
        run: |
          mkdir -p release_assets

          for d in PakClient-Windows-MSVC* PrismLauncher-Windows-MSVC*; do
            [ -d "${d}" ] || continue
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="PakClient-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            if [ -n "${INST}" ]; then
              find . -name "*.exe" -exec cp {} ../release_assets/${NAME}-Setup-${{ env.VERSION }}.exe \;
            else
              zip -r -9 "../release_assets/${NAME}-${{ env.VERSION }}.zip" *
            fi
            cd ..
          done

          for d in PakClient-Windows-MinGW* PrismLauncher-Windows-MinGW*; do
            [ -d "${d}" ] || continue
            cd "${d}" || continue
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            NAME="PakClient-Windows-MinGW"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            if [ -n "${INST}" ]; then
              find . -name "*.exe" -exec cp {} ../release_assets/${NAME}-Setup-${{ env.VERSION }}.exe \;
            else
              zip -r -9 "../release_assets/${NAME}-${{ env.VERSION }}.zip" *
            fi
            cd ..
          done

          # Also collect any loose built setup exes or zips
          find . -maxdepth 2 -name "*Setup*.exe" -exec cp {} release_assets/ \; || true
          find . -maxdepth 2 -name "*Portable*.zip" -exec cp {} release_assets/ \; || true

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: PakClient ${{ env.VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            release_assets/*
